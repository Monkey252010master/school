<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drag Tuner Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <div class="left">
    <h1>Drag Tuner Simulator</h1>

    <div class="control">
      <label for="carSelect">Car</label>
      <select id="carSelect"></select>
    </div>

    <div class="control">
      <label for="engineSelect">Engine</label>
      <select id="engineSelect"></select>
    </div>

    <div class="control">
      <label for="tireSelect">Tires</label>
      <select id="tireSelect"></select>
    </div>

    <button id="generateCode">Generate Race Code</button>
    <input id="myRaceCode" readonly placeholder="Your race code will appear here">

    <h2>Race a Friend</h2>
    <input id="friendCode" placeholder="Enter friend's code">
    <button id="raceFriendBtn">Start Race</button>

  <h2>Staging Tree</h2>

<div id="treeContainer">

  <div class="treeColumn">
    <div class="treeLabel">PRE‑STAGE</div>
    <div class="bulb pre"></div>

    <div class="treeLabel">STAGE</div>
    <div class="bulb stage"></div>

    <div class="treeSpacer"></div>

    <div class="treeLabel small">YELLOW</div>
    <div class="bulb yellow1"></div>

    <div class="treeLabel small">YELLOW</div>
    <div class="bulb yellow2"></div>

    <div class="treeLabel small">YELLOW</div>
    <div class="bulb yellow3"></div>

    <div class="treeLabel">GREEN</div>
    <div class="bulb green"></div>
  </div>

</div>

  <div class="right">
    <h2>Your Build</h2>
    <div id="stats"></div>

    <h2>Race Progress</h2>

<div id="raceBars">
  <div class="raceRow">
    <span>You</span>
    <div class="raceBarOuter">
      <div id="barYou" class="raceBar"></div>
    </div>
  </div>

  <div class="raceRow">
    <span>Friend</span>
    <div class="raceBarOuter">
      <div id="barFriend" class="raceBar"></div>
    </div>
  </div>
</div>

    <h2>Race Results</h2>
    <div id="raceOutput"></div>
  </div>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
