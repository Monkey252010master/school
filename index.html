<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drag Racing School</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="simpleMode">

<header>
  <div class="logoBlock">
    <div class="logoIcon">
      <div class="logoBulb white"></div>
      <div class="logoBulb yellow"></div>
      <div class="logoBulb green"></div>
    </div>
    <div class="logoText">
      <div class="logoTitle">DRAG RACING SCHOOL</div>
      <div class="logoSub">Tuning • Training • Timing</div>
    </div>
  </div>
  <div class="headerRight">
    <span id="tuningModeLabel">Simple Tuning</span>
    <label class="switch">
      <input type="checkbox" id="advancedToggle">
      <span class="slider"></span>
    </label>
  </div>
</header>

<div class="app">

  <!-- LEFT PANEL -->
  <div class="left">
    <h2>Your Build</h2>

    <div class="control">
      <label for="carCategory">Car Category</label>
      <select id="carCategory">
        <option value="all">All</option>
        <option value="muscle">Muscle</option>
        <option value="jdm">JDM</option>
        <option value="truck">Trucks</option>
        <option value="exotic">Exotics</option>
        <option value="drag">Drag Cars</option>
        <option value="classic">Classics</option>
        <option value="hyper">Hypercars</option>
        <option value="electric">Electric</option>
      </select>
    </div>

    <div class="control">
      <label for="carInput">Car</label>
      <input id="carInput" list="carList" placeholder="Search car...">
      <datalist id="carList"></datalist>
    </div>

    <div class="control">
      <label for="engineSelect">Engine</label>
      <select id="engineSelect"></select>
    </div>

    <div class="control">
      <label for="tireSelect">Tires</label>
      <select id="tireSelect"></select>
    </div>

    <div class="control">
      <label for="drivetrainSelect">Drivetrain</label>
      <select id="drivetrainSelect"></select>
    </div>

    <div id="simpleTuning">
      <h3>Simple Tuning</h3>
      <div class="control">
        <label for="weightReduction">Weight Reduction</label>
        <input type="range" id="weightReduction" min="0" max="300" step="25" value="0">
        <span id="weightReductionValue">0 lb</span>
      </div>
      <div class="control">
        <label for="boostLevel">Boost Level</label>
        <input type="range" id="boostLevel" min="0" max="30" step="1" value="0">
        <span id="boostLevelValue">0 psi</span>
      </div>
    </div>

    <div id="advancedTuning" class="hidden">
      <h3>Advanced Tuning</h3>

      <div class="control">
        <label for="pistonsSelect">Pistons</label>
        <select id="pistonsSelect"></select>
      </div>

      <div class="control">
        <label for="rodsSelect">Rods</label>
        <select id="rodsSelect"></select>
      </div>

      <div class="control">
        <label for="camSelect">Camshaft</label>
        <select id="camSelect"></select>
      </div>

      <div class="control">
        <label for="forcedInductionSelect">Turbo / Supercharger</label>
        <select id="forcedInductionSelect"></select>
      </div>

      <div class="control">
        <label for="nitrousSelect">Nitrous</label>
        <select id="nitrousSelect"></select>
      </div>

      <div class="control">
        <label for="fuelSelect">Fuel Type</label>
        <select id="fuelSelect"></select>
      </div>

      <div class="control">
        <label for="gearSelect">Gear Set</label>
        <select id="gearSelect"></select>
      </div>

      <div class="control">
        <label for="suspensionSelect">Suspension</label>
        <select id="suspensionSelect"></select>
      </div>
    </div>

    <div id="stats"></div>

    <button id="generateCode">Generate Race Code</button>
    <input id="myRaceCode" readonly placeholder="Your race code">

    <h2>Race a Friend</h2>
    <input id="friendCode" placeholder="Enter friend's code">
    <button id="raceFriendBtn">Start Race</button>

    <h2>Race Solo</h2>
    <button id="raceSoloBtn">Race Ranked Rival</button>
  </div>

  <!-- CENTER PANEL -->
  <div class="center">
    <h2>Staging Tree</h2>

    <div class="treeWatermark">
      <span>Drag Racing School</span>
    </div>

    <div id="treeContainer">
      <div class="treeColumn">
        <div class="treeLabel">PRE‑STAGE</div>
        <div class="bulb pre white"></div>

        <div class="treeLabel">STAGE</div>
        <div class="bulb stage white"></div>

        <div class="treeSpacer"></div>

        <div class="treeLabel small">YELLOW</div>
        <div class="bulb yellow1 yellow"></div>

        <div class="treeLabel small">YELLOW</div>
        <div class="bulb yellow2 yellow"></div>

        <div class="treeLabel small">YELLOW</div>
        <div class="bulb yellow3 yellow"></div>

        <div class="treeLabel">GREEN</div>
        <div class="bulb green greenBulb"></div>

        <div class="treeLabel">RED</div>
        <div class="bulb red redBulb"></div>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right">
    <h2>Race Progress</h2>

    <div id="raceGrid">
      <div class="lane">
        <h3>You</h3>
        <div class="raceBarOuter">
          <div id="barYou" class="raceBar"></div>
        </div>
      </div>

      <div class="lane">
        <h3>Opponent</h3>
        <div class="raceBarOuter">
          <div id="barFriend" class="raceBar"></div>
        </div>
      </div>
    </div>

    <h2>Race Results</h2>
    <div id="raceOutput"></div>
  </div>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
